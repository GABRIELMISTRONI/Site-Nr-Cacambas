  <script>
  // Cursor idêntico ao corrigido no main.js
  (function() {
    if (window.matchMedia('(max-width:768px)').matches) return;
    if (window.matchMedia('(pointer:coarse)').matches) return;
    var dot  = document.getElementById('cursor-dot');
    var ring = document.getElementById('cursor-ring');
    if (!dot || !ring) return;
    var mx=0,my=0,rx=0,ry=0,rafId=null,visible=false;
    var ringHalf=18;
    function moveDot(x,y)  { dot.style.transform ='translate('+(x-4)+'px,'+(y-4)+'px)'; }
    function moveRing(x,y) { ring.style.transform='translate('+(x-ringHalf)+'px,'+(y-ringHalf)+'px)'; }
    document.addEventListener('mousemove',function(e){
      mx=e.clientX;my=e.clientY;
      moveDot(mx,my);
      if(!visible){visible=true;rx=mx;ry=my;moveRing(rx,ry);dot.style.opacity='1';ring.style.opacity='1';}
      if(!rafId) rafId=requestAnimationFrame(tick);
    },{passive:true});
    function tick(){
      rafId=null;
      rx+=(mx-rx)*0.13;ry+=(my-ry)*0.13;
      moveRing(rx,ry);
      if(Math.abs(mx-rx)>0.3||Math.abs(my-ry)>0.3) rafId=requestAnimationFrame(tick);
    }
    document.querySelectorAll('a,button').forEach(function(el){
      el.addEventListener('mouseenter',function(){ring.classList.add('is-hovering');dot.style.opacity='0';},{passive:true});
      el.addEventListener('mouseleave',function(){ring.classList.remove('is-hovering');dot.style.opacity=visible?'1':'0';},{passive:true});
    });
    document.addEventListener('mouseleave',function(){dot.style.opacity='0';ring.style.opacity='0';});
    document.addEventListener('mouseenter',function(){if(visible){dot.style.opacity='1';ring.style.opacity='1';}});
  })();
  </script>
